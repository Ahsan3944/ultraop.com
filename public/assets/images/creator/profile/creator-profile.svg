<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24140D"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E63900"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" rx="40" fill="url(#avatarGrad)"/>
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#accentGrad)" stroke-width="4"/>

  <!-- Ahsan Gamer Illustration with Glasses & Headset -->
  <path d="M 120 220 A 130 130 0 0 1 380 220" fill="none" stroke="#262626" stroke-width="26" stroke-linecap="round"/>
  <path d="M 130 210 A 120 120 0 0 1 370 210" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Head & Skin -->
  <ellipse cx="250" cy="245" rx="95" ry="105" fill="#F0C2A2"/>

  <!-- Hair -->
  <path d="M 155 220 C 145 150, 230 100, 320 120 C 355 130, 365 175, 345 210 C 330 190, 310 180, 285 190 C 260 175, 230 180, 215 200 C 190 195, 175 205, 155 220 Z" fill="#1C1A19"/>

  <!-- Eyebrows -->
  <path d="M 185 210 Q 215 198 235 210" fill="none" stroke="#121212" stroke-width="10" stroke-linecap="round"/>
  <path d="M 265 210 Q 285 198 315 210" fill="none" stroke="#121212" stroke-width="10" stroke-linecap="round"/>

  <!-- Glasses Frame -->
  <rect x="180" y="215" width="60" height="42" rx="8" fill="#FFFFFF" fill-opacity="0.85" stroke="#121212" stroke-width="8"/>
  <rect x="260" y="215" width="60" height="42" rx="8" fill="#FFFFFF" fill-opacity="0.85" stroke="#121212" stroke-width="8"/>
  <line x1="240" y1="235" x2="260" y2="235" stroke="#121212" stroke-width="8"/>

  <!-- Eyes behind glasses -->
  <circle cx="210" cy="235" r="9" fill="#121212"/>
  <circle cx="290" cy="235" r="9" fill="#121212"/>
  <circle cx="207" cy="232" r="3" fill="#FFFFFF"/>
  <circle cx="287" cy="232" r="3" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M 245 245 Q 250 265 258 266 Q 242 268 242 266" fill="#D98A6A"/>

  <!-- Mustache and Smile -->
  <path d="M 210 282 Q 250 295 290 282 Q 270 290 250 288 Q 230 290 210 282 Z" fill="#121212"/>
  <path d="M 215 292 Q 250 330 285 292 Z" fill="#8B0000"/>
  <path d="M 220 292 Q 250 302 280 292 Z" fill="#FFFFFF"/>

  <!-- Beard -->
  <path d="M 165 250 C 165 340, 200 370, 250 370 C 300 370, 335 340, 335 250 C 320 275, 310 300, 290 312 C 280 338, 220 338, 210 312 C 190 300, 180 275, 165 250 Z" fill="#121212"/>

  <!-- Headset Earcups -->
  <rect x="100" y="200" width="45" height="85" rx="18" fill="#181818" stroke="url(#accentGrad)" stroke-width="6"/>
  <rect x="355" y="200" width="45" height="85" rx="18" fill="#181818" stroke="url(#accentGrad)" stroke-width="6"/>

  <!-- Hoodie Collar -->
  <path d="M 140 430 L 210 370 L 290 370 L 360 430 L 390 500 L 110 500 Z" fill="#161616" stroke="#2B2B2B" stroke-width="4"/>
  <path d="M 210 370 L 250 450 L 290 370" fill="#FF3E00"/>
</svg>
