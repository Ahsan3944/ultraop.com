<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3E00"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF0055"/>
    </linearGradient>
    <linearGradient id="cyberDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" rx="50" fill="url(#cyberDark)"/>
  
  <!-- Outer Gaming Ring -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#gameGrad)" stroke-width="8" stroke-dasharray="20 10"/>
  <circle cx="250" cy="250" r="185" fill="#1C1C1C" stroke="#333333" stroke-width="3"/>

  <!-- Gamer Mask & Headset Silhouette -->
  <!-- Headset band -->
  <path d="M 120 230 C 120 130, 380 130, 380 230" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <!-- Ear Cups -->
  <rect x="100" y="210" width="36" height="70" rx="10" fill="#FF3E00" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="364" y="210" width="36" height="70" rx="10" fill="#FF3E00" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Geometric Ninja/Gamer Face Mask -->
  <polygon points="170,220 330,220 310,330 250,370 190,330" fill="#111111" stroke="url(#gameGrad)" stroke-width="6"/>

  <!-- Glowing Esports Eyes -->
  <polygon points="190,250 235,260 225,275 185,265" fill="#00FFA3"/>
  <polygon points="310,250 265,260 275,275 315,265" fill="#00FFA3"/>

  <!-- Mouth Guard Lines -->
  <line x1="220" y1="315" x2="280" y2="315" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="235" y1="335" x2="265" y2="335" stroke="#FF3E00" stroke-width="4" stroke-linecap="round"/>

  <!-- Bottom Tag -->
  <text x="250" y="425" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
    OP ESPORTS
  </text>
</svg>
